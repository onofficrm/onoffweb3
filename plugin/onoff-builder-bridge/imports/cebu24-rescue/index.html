  <body class="bg-[#0b0b0c] text-white selection:bg-[#FFC400] selection:text-black antialiased overflow-x-hidden">
    <div id="root"></div>
    <script>
      (function () {
        var marked = false;
        function refreshAdminAlert() {
          var native = window.Cebu24Native;
          if (!native || typeof native.markAdmin !== "function") return;
          try { native.markAdmin(); } catch (e) {}
        }
        function markAdminPhone() {
          if (marked) return;
          if (!document.getElementById("screen-admin-dashboard")) return;
          refreshAdminAlert();
          marked = true;
        }
        document.addEventListener("click", function (event) {
          var button = event.target && event.target.closest ? event.target.closest("button") : null;
          if (!button) return;
          var dialog = document.getElementById("admin-status-confirm");
          if (!dialog || !dialog.contains(button)) return;
          if ((button.textContent || "").indexOf("저장") === -1) return;
          var text = dialog.textContent || "";
          if (text.indexOf("처리중") === -1 && text.indexOf("처리완료") === -1) return;
          setTimeout(refreshAdminAlert, 1200);
          setTimeout(refreshAdminAlert, 16000);
        }, true);
        setInterval(markAdminPhone, 1000);
      })();
    </script>
  </body>
